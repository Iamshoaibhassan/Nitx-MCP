[project]
name = "nitx-poster-mcp-server"
version = "1.0.0"
requires-python = ">=3.13"

[tool.poetry]
package-mode = false

[tool.poetry.dependencies]
python = "^3.13"
fastapi = "0.143.0"
uvicorn = {version = "0.54.0", extras = ["standard"]}
pydantic = "2.14.1"
redis = "8.1.0"
httpx = "0.28.1"
mcp = {version = "2.3.0", extras = ["cli"]}
python-dotenv = "1.2.4"

[tool.poetry.group.dev.dependencies]
pytest = "9.1.1"
pytest-asyncio = "1.4.0"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[build-system]
requires = ["poetry-core>=2.0"]
build-backend = "poetry.core.masonry.api"
